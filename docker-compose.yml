version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sigmachat-postgres
    environment:
      POSTGRES_DB: sigma_chat
      POSTGRES_USER: ${DB_USER:-sigma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sigma}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sigmachat-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigmachat-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-sigma}:${DB_PASSWORD:-changeme}@postgres:5432/sigma_chat
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-random-secret}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      UPLOAD_DIR: /tmp/uploads
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/tmp/uploads
    restart: unless-stopped
    networks:
      - sigmachat-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  sigmachat-network:
    driver: bridge
